name: Build and Push Docker Memory App

on:
  push:
    branches: [ master ]  # ✅ make sure correct branch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend with ARG
        run: |
          docker build \
            -t myuser/docker-memory-frontend:${{ github.sha }} \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.API_URL }} \
            ./frontend

      - name: Build backend
        run: |
          docker build \
            -t myuser/docker-memory-backend:${{ github.sha }} \
            ./backend

      - name: Push images
        run: |
          docker push myuser/docker-memory-frontend:${{ github.sha }}
          docker push myuser/docker-memory-backend:${{ github.sha }}
